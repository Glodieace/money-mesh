services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moneymesh
      POSTGRES_USER: moneymesh
      POSTGRES_PASSWORD: moneymesh-demo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneymesh -d moneymesh"]
      interval: 5s
      timeout: 5s
      retries: 15

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-moneymesh-demo}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-moneymesh-demo}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$NEO4J_PASSWORD\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  blockchain:
    build:
      context: .
      dockerfile: apps/chain/Dockerfile
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})}).then(async r=>{if(!r.ok||!(await r.json()).result)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DEMO_MODE: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-MoneyMeshDemo!2026}
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-before-deployment}
      DATABASE_URL: postgresql+psycopg://moneymesh:moneymesh-demo@postgres:5432/moneymesh
      NEO4J_ENABLED: ${NEO4J_ENABLED:-true}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-moneymesh-demo}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      BLOCKCHAIN_MODE: ${BLOCKCHAIN_MODE:-local}
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-http://blockchain:8545}
      BLOCKCHAIN_CHAIN_ID: ${BLOCKCHAIN_CHAIN_ID:-31337}
      EVIDENCE_CONTRACT_ADDRESS: ${EVIDENCE_CONTRACT_ADDRESS:-}
      WEB_ORIGIN: http://localhost:3000
      APP_ENV: development
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      blockchain:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        DEMO_MODE: ${DEMO_MODE:-true}
        DEMO_PASSWORD: ${DEMO_PASSWORD:-MoneyMeshDemo!2026}
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  neo4j-data:
